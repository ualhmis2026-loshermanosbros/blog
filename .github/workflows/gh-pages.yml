name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: ["configuracion-azure"]
  workflow_dispatch:

# Permisos estrictamente necesarios para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: recursive # Vital para el tema PaperMod
          fetch-depth: 0

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Instalar Hugo (Método Seguro)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Construir la web con Hugo
        # Usamos el baseURL dinámico para que GitHub Pages ponga la URL correcta
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4